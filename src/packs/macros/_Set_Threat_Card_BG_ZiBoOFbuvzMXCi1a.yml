name: +Set Threat Card BG
type: script
command: |-
  for (const actor of game.actors) {
    if (actor.type !== 'threat') continue;
    if (!actor.system.details.threatcardbg || 
        actor.system.details.threatcardbg === actor.img) {

      const img = actor.img;
      
      if (img.startsWith('modules/te') && img.endsWith('.Avatar.webp'))
        actor.update({'system.details.threatcardbg': img.replace('.Avatar.webp', '-large.webp')});
    }
  }
img: icons/svg/dice-target.svg
