name: +Set Threat Card BG
type: script
command: |-
  for (const actor of game.actors) {
    if (actor.type !== 'threat') continue;
    // Some published modules have "?xxxxxx" on the end of the filename
    const img = actor.img.replace(/\?\d*$/,'');
    
    if (actor.system.details.threatcardbg &&
        actor.system.details.threatcardbg !== img) continue;
    if (!img.startsWith('modules/te')) continue;

    const toreplace = img.endsWith('.Avatar.webp') ? '.Avatar.webp' : '.webp';
    let newimg = img;
    let testimg = img.replace(toreplace, '-large.webp');
    let resp = await fetch(testimg);
    console.log(resp);
    if (resp.ok)
      newimg = testimg;
    else {
      testimg = img.replace(toreplace, '_large.webp');
      resp = await fetch(testimg);
      if (resp.ok)
        newimg = testimg;
    }
    
    await actor.update({'system.details.threatcardbg': newimg});
  }
img: icons/svg/dice-target.svg
